name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Build
        run: cd backend && mvn -q package -DskipTests
      - name: Test (skip context-loads — needs real DB)
        run: cd backend && mvn -q test -Dtest='!EvocodeApplicationTests'

  analyzer:
    name: Analyzer (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: analyzer
        run: |
          pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn
          pip install pytest
      - name: Test
        working-directory: analyzer
        run: python -m pytest tests/ -q --tb=short
