name: pages

# 构建并部署到 GitHub Pages：文档站（MkDocs Material）+ 前端静态演示（Vite build）
# 产物合并到 site/：docs → 根，前端 → site/frontend/
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install mkdocs-material
      - run: mkdocs build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        # Pages 上只有前端、没有后端：产物需明确标注为「静态演示」，
        # 而不是把注定 404 的 /api/v1 请求静默渲染成一片 0
        env:
          VITE_DEMO: '1'
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Merge frontend into site
        run: cp -r frontend/dist site/frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
