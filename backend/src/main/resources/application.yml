spring:
  application:
    name: evocode-backend
  config:
    # 审查修复：backend 从根 .env 读取（README:125 承诺）——此前 backend 无任何 .env
    # 机制，改 POSTGRES_PASSWORD 后仍用默认值连库失败。import 的 .env 优先级低于
    # OS 环境变量（满足「进程环境变量 > 根 .env」）；optional 前缀避免缺文件启动失败。
    import: optional:file:../.env[.properties]
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/evocode}
    username: ${POSTGRES_USER:evocode}
    password: ${POSTGRES_PASSWORD:evocode_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      # AD-017：redis 宿主端口改绑 6380（避 polycode 6379 冲突）；容器内仍 6379
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  # 审查修复：默认端口与全项目约定一致（README/scripts 均 18080）——此前默认 8080，
  # 手动 java -jar 未设 BACKEND_PORT 时起在 8080，与 start-dev.bat 的 18080 不一致
  port: ${BACKEND_PORT:18080}
  # 审查 H2：项目铁律「仅监听 127.0.0.1，禁止暴露公网」——默认仅本机回环，勿删
  address: ${SERVER_ADDRESS:127.0.0.1}

evocode:
  data-dir: ${DATA_DIR:data}
  analyzer-url: ${ANALYZER_URL:http://127.0.0.1:8081}

logging:
  level:
    com.evocode: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
