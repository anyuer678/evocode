site_name: EvoCode 文档
site_description: EvoCode - AI 软件体检与演化平台：技术文档（需求/架构/契约/数据字典/规范/测试/治理）
site_url: https://anyuer678.github.io/evocode/
repo_url: https://github.com/anyuer678/evocode
repo_name: anyuer678/evocode
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: zh

nav:
  - 概览: index.md
  - 产品:
      - 需求分析: 01-需求分析.md
      - 开发指导: 02-开发指导.md
      - 模块详细设计: 09-模块详细设计.md
  - 架构与契约:
      - 架构设计: 04-架构设计.md
      - 架构审查: 05-架构审查.md
      - API 契约: 06-API契约.md
      - 数据字典: 07-数据字典.md
  - 工程规范:
      - 开发规范: 03-开发规范.md
      - 测试计划: 08-测试计划.md
  - 治理:
      - 技术债管理方案: 10-技术债管理方案.md
      - 技术债监控与质量指标体系: 11-技术债监控与质量指标体系.md
  - 决策记录:
      - AD-017 Redis 端口: decisions/AD-017-redis-port.md
      - AD-018 Redis 缓存: decisions/AD-018-redis-cache.md
      - AD-019 任务恢复: decisions/AD-019-task-recovery.md
  - 里程碑度量:
      - v1.1: metrics/2026-08-13-v1.1.md
      - v1.2: metrics/2026-08-13-v1.2.md
